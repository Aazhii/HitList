# Builds the HitList desktop apps for Mac, Windows and Linux.
#
# Run it by hand: GitHub -> Actions -> "Build desktop apps" -> Run workflow.
# Or push a tag such as v1.2.0 and it runs by itself and publishes a release.
#
# The version comes from the form when you run it by hand: main.second.third (for example 1.2.5). Leave the third field empty
# and it becomes the run number (1.1.57, 1.1.58, ...), which only ever goes up, so it can never repeat. A pushed tag v1.2.3 uses
# its own number. The commit id is in the artifact names and in SHA256SUMS.txt. Nothing is signed (no certificates); see docs/building.
name: Build desktop apps

on:
  # The form, kept short on purpose: Name _ Major . Minor . Patch - Stage + Stage no.   e.g. HitList_1.2.5-beta2
  #   Patch empty = the run number (always new). Stage none/alpha/beta; Stage no. only with alpha/beta (empty = 1).
  workflow_dispatch:
    inputs:
      release_name:
        description: Name
        type: string
        default: HitList
      major:
        description: Major
        type: string
        default: '1'
      minor:
        description: Minor
        type: string
        default: '1'
      patch:
        description: Patch
        type: string
        default: ''
      stage:
        description: Stage
        type: choice
        options: [none, alpha, beta]
        default: none
      stage_number:
        description: Stage no.
        type: string
        default: ''
      publish:
        description: Publish release
        type: boolean
        default: false
  push:
    tags: ['v*', '*_[0-9]*']

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Which version and commit this run is --------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          IN_NAME: ${{ inputs.release_name }}
          IN_MAJOR: ${{ inputs.major }}
          IN_MINOR: ${{ inputs.minor }}
          IN_PATCH: ${{ inputs.patch }}
          IN_STAGE: ${{ inputs.stage }}
          IN_STAGE_NUM: ${{ inputs.stage_number }}
        run: |
          sh scripts/ci/compute-version.sh >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          VERSION=$(grep '^version=' "$GITHUB_OUTPUT" | cut -d= -f2)
          echo "Building ${VERSION} from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  # ---- Every test, before anything is built ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Web - install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Web - design rules, types, lint, tests
        working-directory: web
        run: |
          pnpm design:check
          pnpm exec tsc -b
          pnpm exec eslint src test
          pnpm vitest run
      - name: API - tests
        run: mvn -B -f api/pom.xml test
      - name: Desktop - tests
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Backup function - tests
        working-directory: functions/backup
        run: node --test test.backupService.js

  # ---- The one backend that goes into all three apps (the web app is inside the jar) ------------------------------------
  backend:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Build the web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b
          pnpm exec vite build
      - name: Put the web app inside the jar and build it
        run: |
          mkdir -p api/src/main/resources/static
          cp -R web/dist/. api/src/main/resources/static/
          mvn -B -f api/pom.xml -DskipTests package
          cp api/target/hitlist.jar hitlist.jar
      - uses: actions/upload-artifact@v4
        with:
          name: hitlist-jar
          path: hitlist.jar
          retention-days: 3

  # ---- Mac (Apple silicon) .dmg ------------------------------------------------------------------------------------------
  mac:
    needs: [version, backend]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4   # provides jlink, which builds the small Mac Java runtime
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: hitlist-jar, path: desktop/resources }
      - name: Build the .dmg and the update .zip
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          sh scripts/prepare-jre.sh
          pnpm exec electron-builder --mac --arm64 --publish never -c.extraMetadata.version=${{ needs.version.outputs.version }}
      - name: Checksum
        working-directory: desktop/dist
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HitList-${{ needs.version.outputs.version }}-${{ needs.version.outputs.sha }}-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS-mac.txt
          retention-days: 3

  # ---- Windows installer (.exe). Built on Windows: on Linux the installer tool needs Wine to make the uninstaller. ---------
  windows:
    needs: [version, backend]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { name: hitlist-jar, path: desktop/resources }
      - name: Build the .exe
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          bash scripts/prepare-jre-win.sh
          pnpm exec electron-builder --win --x64 --publish never -c.extraMetadata.version=${{ needs.version.outputs.version }}
      - name: Checksum
        working-directory: desktop/dist
        run: sha256sum *.exe > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HitList-${{ needs.version.outputs.version }}-${{ needs.version.outputs.sha }}-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS-windows.txt
          retention-days: 3

  # ---- Linux .AppImage and .deb --------------------------------------------------------------------------------------------
  linux:
    needs: [version, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { name: hitlist-jar, path: desktop/resources }
      - name: Build the .AppImage and .deb
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          sh scripts/prepare-jre-linux.sh
          pnpm exec electron-builder --linux --x64 --publish never -c.extraMetadata.version=${{ needs.version.outputs.version }}
      - name: Checksum
        working-directory: desktop/dist
        run: sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HitList-${{ needs.version.outputs.version }}-${{ needs.version.outputs.sha }}-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/SHA256SUMS-linux.txt
          retention-days: 3

  # ---- Optional: a GitHub Release with every file (a tag push, or "publish" ticked) ---------------------------------------
  release:
    if: ${{ github.ref_type == 'tag' || inputs.publish }}
    needs: [version, mac, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HitList-*
          merge-multiple: true
          path: release
      - name: One checksum file, then publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ needs.version.outputs.name }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A release called ${TAG} already exists. Run again with a different version (or leave the third field empty for an automatic number)." >&2
            exit 1
          fi
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          FLAGS=""
          if [ "${PRERELEASE}" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" ${FLAGS} \
            --title "${NAME} ${VERSION}" \
            --notes "Built from commit ${SHA}. Mac (.dmg), Windows (.exe), Linux (.AppImage and .deb). The apps are not signed; see docs/INSTALL.md for the first-open steps. SHA256SUMS.txt lists the checksums." \
            ./*
