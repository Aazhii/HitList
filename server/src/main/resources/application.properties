# ============================================================
# Kaizen Todo — Spring Boot Server Configuration
# ============================================================

spring.application.name=kaizen-todo-server
server.port=8080

# ============================================================
# H2 In-Memory Database (dev)
# ============================================================
spring.datasource.url=jdbc:h2:mem:kaizendb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console — http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JPA / Hibernate
# schema.sql owns DDL; Hibernate must NOT recreate tables.
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# SQL Initialisation
# schema.sql runs first (DDL), then data.sql (seed).
# defer-datasource-initialization=true ensures both run AFTER
# the connection pool is ready.
# ============================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ============================================================
# Jackson — serialise Instant as ISO-8601 strings
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================
# Logging
# ============================================================
logging.level.com.kaizen=INFO
logging.level.org.springframework.web=INFO
