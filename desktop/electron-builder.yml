# Packages the shell (main.js), api/'s jar, and a minimal Java runtime into a
# real .app / .dmg. web/dist isn't listed separately — it's already inside
# hitlist.jar as static resources (see scripts/prepare-jar.sh), so bundling
# the jar is bundling the whole frontend too; nothing here reimplements that.

appId: com.hitlist.desktop
productName: HitList
afterPack: scripts/afterPack.js

directories:
  output: dist

files:
  - main.js
  - auth.js
  - backup.js
  - restore.js
  - dataDir.js
  - preload.js
  - catalyst-config.js
  - package.json

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  extraResources:
    - from: resources/hitlist.jar
      to: hitlist.jar
    - from: resources/jre
      to: jre

# Windows: a normal installer (.exe) for 64-bit Windows; it also runs on ARM PCs through Windows' own emulation.
# Not signed (no certificate), so Windows SmartScreen shows a warning the first time; see docs/INSTALL.md.
# signAndEditExecutable false: editing the .exe's metadata needs Wine on a Mac, and there is nothing to sign.
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
  extraResources:
    - from: resources/hitlist.jar
      to: hitlist.jar
    - from: resources/jre-win
      to: jre

# Linux: an AppImage (one file that runs on most distributions) and a .deb (Ubuntu, Debian). 64-bit PCs only.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  maintainer: HitList <noreply@hitlist.invalid>
  synopsis: Tasks, notes and databases on your own computer
  description: HitList keeps your tasks, notes and databases on your own computer and works without the internet.
  extraResources:
    - from: resources/hitlist.jar
      to: hitlist.jar
    - from: resources/jre-linux
      to: jre

deb:
  artifactName: HitList_${version}_amd64.${ext}
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]

appImage:
  artifactName: HitList-${version}-x64.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  artifactName: HitList-Setup-${version}-x64.${ext}
