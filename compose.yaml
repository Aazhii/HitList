services:
  hitlist:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the host PostgreSQL 9.5 service}
      SERVER_PORT: ${SERVER_PORT:-8080}
      OWNER_COOKIE_SECRET: ${OWNER_COOKIE_SECRET:?Set a persistent 32-byte OWNER_COOKIE_SECRET}
    ports:
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
